<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categories - Trend Mart</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Roboto', sans-serif;
        }
        body {
            background-color: #f1f2f6;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 15px 0;
            padding-bottom: 100px;
            overflow-x: hidden;
        }
        .header {
            width: 100%;
            max-width: 100%;
            padding: 20px 15px;
            position: fixed;
            top: 0;
            left: 0;
            background: #fff;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        h1 {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(90deg, #2874f0, #fb641b);
            -webkit-background-clip: text;
            color: transparent;
            text-align: center;
            flex-grow: 1;
        }
        .main-container {
            width: 100%;
            max-width: 1200px;
            padding-top: 90px;
            padding: 90px 15px 0;
        }
        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 12px;
        }
        .category-card {
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 15px 10px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s ease-out, box-shadow 0.2s ease-out;
        }
        .category-card:hover {
            transform: scale(1.03);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }
        .category-card img {
            width: 60px;
            height: 60px;
            object-fit: contain;
            margin-bottom: 8px;
        }
        .category-card p {
            font-size: 0.9rem;
            font-weight: 500;
            color: #333;
            text-transform: uppercase;
        }
        .footer {
            background: #fff;
            color: #333;
            width: 100%;
            max-width: 100%;
            padding: 10px 15px;
            display: flex;
            justify-content: space-around;
            position: fixed;
            bottom: 0;
            left: 0;
            box-shadow: 0 -2px 5px rgba(0, 0, 0, 0.1);
            z-index: 1000;
        }
        .footer .nav-item {
            text-align: center;
            width: 33.33%;
            transition: transform 0.3s ease-out;
        }
        .footer .nav-item a {
            text-decoration: none;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .footer .nav-item img {
            width: 25px;
            height: 25px;
            margin-bottom: 5px;
        }
        .footer .nav-item p {
            font-size: 0.8rem;
            font-weight: 500;
            margin: 0;
            color: #333;
        }
        .footer .nav-item:hover {
            transform: scale(1.1);
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>ALL CATEGORIES</h1>
    </div>
    <main class="main-container">
        <div class="category-grid">
            <div class="category-card" onclick="window.location.href='bag/school.html'">
