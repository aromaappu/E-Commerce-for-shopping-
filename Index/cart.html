<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart | Trend Mart</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Roboto', sans-serif; }
        body { background: #fff; color: #333; min-height: 100vh; }
        header {
            background: #fff; padding: 15px 25px; height: 80px;
            display: flex; align-items: center; gap: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); position: sticky; top: 0; z-index: 1000;
        }
        header .back-arrow { font-size: 2rem; cursor: pointer; color: #333; text-decoration: none; }
        header h1 { font-size: 1.6rem; font-weight: 600; }
        .container { max-width: 900px; margin: 20px auto; padding: 0 15px 100px; }
        .cart-empty {
            text-align: center; padding: 60px 20px; color: #666;
        }
        .cart-empty i { font-size: 4rem; color: #ccc; margin-bottom: 15px; }
        .cart-empty p { font-size: 1.1rem; margin-bottom: 20px; }
        .cart-empty a {
            display: inline-block; padding: 12px 28px; background: #1a1a1a; color: #fff;
            text-decoration: none; border-radius: 6px;
        }
        .cart-item {
            display: flex; align-items: center; gap: 15px; padding: 15px;
            border: 1px solid #eee; border-radius: 8px; margin-bottom: 12px;
            background: #fff;
        }
        .cart-item img { width: 90px; height: 90px; object-fit: cover; border-radius: 6px; flex-shrink: 0; }
        .cart-item .info { flex: 1; min-width: 0; }
        .cart-item .info .name { font-weight: 600; font-size: 15px; }
        .cart-item .info .code { color: #888; font-size: 12px; margin: 4px 0; }
        .cart-item .info .price { font-weight: 600; }
        .cart-item .qty {
            display: flex; align-items: center; gap: 8px;
            border: 1px solid #ddd; border-radius: 6px; padding: 4px 8px;
        }
        .cart-item .qty button {
            width: 26px; height: 26px; border: none; background: #f1f1f1; border-radius: 4px;
            cursor: pointer; font-size: 16px; line-height: 1;
        }
        .cart-item .qty span { min-width: 24px; text-align: center; font-weight: 600; }
        .cart-item .remove {
            color: #e63946; cursor: pointer; font-size: 1.2rem; background: none; border: none; padding: 6px;
        }
        .order-summary {
            border: 1px solid #eee; border-radius: 8px; padding: 18px; background: #fafafa; margin-top: 20px;
        }
        .order-summary h3 { margin-bottom: 10px; }
        .order-summary .row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 15px; }
        .order-summary .total { font-weight: 600; font-size: 18px; border-top: 1px solid #ddd; margin-top: 8px; padding-top: 10px; }
        .checkout-form { margin-top: 15px; }
        .checkout-form label { display: block; font-size: 13px; font-weight: 600; margin: 12px 0 5px; }
        .checkout-form input, .checkout-form textarea {
            width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px;
        }
        .btn {
            display: block; width: 100%; padding: 15px; border: none; border-radius: 8px;
            font-size: 16px; font-weight: 600; cursor: pointer; color: #fff; background: #25D366;
            margin-top: 15px;
        }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .tracking-box {
            background: #f0fff4; border: 1px solid #b7e9c7; border-radius: 8px; padding: 15px;
            text-align: center; margin-top: 15px; display: none;
        }
        .tracking-box .code { font-size: 1.4rem; font-weight: 700; color: #0a7d3a; letter-spacing: 1px; }
        .tracking-box p { font-size: 13px; color: #555; margin-top: 5px; }
        .note { font-size: 12px; color: #888; margin-top: 10px; text-align: center; }
    </style>
</head>
<body>
    <header>
        <span class="back-arrow" onclick="history.back()">←</span>
        <h1>My Cart</h1>
    </header>
    <div class="container" id="cart-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="shared/config.js"></script>
    <script src="shared/supabase-client.js"></script>
    <script src="shared/cart.js"></script>
    <script>
        function absUrl(u) {
            try { return new URL(u, location.href).href; } catch (e) { return u; }
        }

        function render() {
            const container = document.getElementById('cart-container');
            const items = window.TMCart.getItems();
            if (items.length === 0) {
                container.innerHTML = `
                    <div class="cart-empty">
                        <i class="fas fa-shopping-cart"></i>
                        <p>Your cart is empty</p>
                        <a href="index.html">Continue Shopping</a>
                    </div>`;
                return;
            }
            const list = items.map(function (it) {
                const price = parseFloat(String(it.price).replace(/[^0-9.]/g, "")) || 0;
                return `
                    <div class="cart-item" data-id="${it.id}">
                        <img src="${it.img}" >
                        <div class="info">
                            <div class="name">${it.name}</div>
                            <div class="code">Code: ${it.code}</div>
                            <div class="price">${it.price}</div>
                        </div>
                        <div class="qty">
                            <button onclick="TMCart.setQty('${it.id}', ${it.qty - 1}); render();">−</button>
                            <span>${it.qty}</span>
                            <button onclick="TMCart.setQty('${it.id}', ${it.qty + 1}); render();">+</button>
                        </div>
                        <button class="remove" onclick="TMCart.remove('${it.id}'); render();"><i class="fas fa-trash-alt"></i></button>
                    </div>`;
            }).join('');

            container.innerHTML = `
                <div id="cart-items">${list}</div>
                <div class="order-summary">
                    <h3>Order Summary</h3>
                    <div class="row"><span>Items</span><span>${TMCart.getCount()}</span></div>
                    <div class="row"><span>Total</span><span>${TMCart.formatTotal()}</span></div>
                    <div class="row total"><span>Total Payable</span><span>${TMCart.formatTotal()}</span></div>
                    <div class="checkout-form">
                        <label>Your Name *</label>
                        <input id="cust-name" placeholder="Enter your name">
                        <label>Phone Number *</label>
                        <input id="cust-phone" placeholder="Enter WhatsApp number" type="tel">
                        <label>Address</label>
                        <textarea id="cust-address" rows="2" placeholder="Delivery address (optional)"></textarea>
                    </div>
                    <button class="btn" id="place-order-btn" onclick="placeOrder()">
                        <i class="fab fa-whatsapp"></i> Place Order on WhatsApp
                    </button>
                    <div class="note">You will be redirected to WhatsApp with your order details. You will receive your tracking code on WhatsApp after confirmation.</div>
                </div>`;
        }

        function buildMessage(orderItems, customer) {
            const lines = [];
            lines.push("🛍️ *TREND MART - NEW ORDER*");
            lines.push("Order Time: " + new Date().toLocaleString("en-IN"));
            lines.push("");
            orderItems.forEach(function (it, idx) {
                lines.push((idx + 1) + ") " + it.name);
                lines.push("   Code: " + it.code);
                lines.push("   Price: " + it.price + "  Qty: " + it.qty);
                lines.push("   Image: " + absUrl(it.img));
            });
            lines.push("");
            lines.push("Total: " + TMCart.formatTotal());
            lines.push("");
            lines.push("Customer: " + customer.name);
            lines.push("Phone: " + customer.phone);
            if (customer.address) lines.push("Address: " + customer.address);
            lines.push("");
            lines.push("Please confirm my order.");
            return lines.join("\n");
        }

        function placeOrder() {
            const name = document.getElementById('cust-name').value.trim();
            const phone = document.getElementById('cust-phone').value.trim();
            const address = document.getElementById('cust-address').value.trim();
            if (!name) { alert("Please enter your name"); return; }
            if (!phone) { alert("Please enter your phone number"); return; }

            const items = window.TMCart.getItems();
            const customer = { name: name, phone: phone, address: address };
            const cfg = window.TM_CONFIG || {};
            const message = buildMessage(items, customer);
            const waUrl = "https://wa.me/" + cfg.WHATSAPP_NUMBER + "?text=" + encodeURIComponent(message);
            window.open(waUrl, '_blank');
        }

        document.addEventListener('DOMContentLoaded', render);
    </script>
</body>
</html>
