<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categories | Trend Mart</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh; /* Ensure body takes full height for footer positioning */
        }

        /* Header */
        .header {
            width: 100%;
            background-color: #fff;
            color: #000;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: fixed;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid #ddd;
        }

        .header .back-arrow {
            font-size: 24px;
            cursor: pointer;
            margin-right: 15px;
            padding: 5px 10px;
            background-color: #f5f5f5;
            border-radius: 50%;
            transition: background-color 0.3s ease;
            position: absolute;
            left: 15px;
        }

        .header .back-arrow:hover {
            background-color: #ddd;
        }

        .header .title {
            font-size: 16px;
            font-weight: bold;
            text-align: center;
        }

        /* Search Bar */
        .search-container {
            position: absolute;
            right: 15px;
            display: flex;
            align-items: center;
        }

        .search-icon {
            font-size: 20px;
            cursor: pointer;
            padding: 5px;
            color: #333;
            transition: color 0.3s ease;
        }

        .search-icon:hover {
            color: #000;
        }

        .search-bar {
            padding: 5px 10px;
            font-size: 14px;
            border: 1px solid #ddd;
            border-radius: 20px;
            outline: none;
            width: 0;
            opacity: 0;
            transition: width 0.3s ease, opacity 0.2s ease;
            position: absolute;
            right: 30px;
        }

        .search-bar.active {
            width: 150px;
            opacity: 1;
        }

        .suggestions {
            position: absolute;
            top: 100%;
            right: 0;
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 5px;
            max-height: 150px;
            overflow-y: auto;
            width: 200px;
            display: none;
            z-index: 1001;
        }

        .suggestions div {
            padding: 8px;
            cursor: pointer;
            text-align: left;
        }

        .suggestions div:hover {
            background-color: #f5f5f5;
        }

        /* Content */
        .content {
            margin-top: 60px;
            width: 100%;
            max-width: 600px;
            padding: 15px;
            text-align: center;
            background-color: #fff;
            margin-bottom: 60px; /* Add margin to prevent overlap with footer */
        }

        .product-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .product-item {
            text-align: center;
        }

        .product-image {
            width: 100%;
            height: auto;
            cursor: pointer;
            background-color: #fff;
        }

        .product-name {
            margin-top: 10px;
            font-size: 20px;
            font-weight: bold;
            text-align: left;
            color: #000;
        }

        /* Footer (Bottom Navigation Bar) */
        .footer {
            background: #fff;
            color: #333;
            width: 100%;
            padding: 10px 0;
            display: flex;
            justify-content: space-around;
            position: fixed;
            bottom: 0;
            left: 0;
            box-shadow: 0 -2px 5px rgba(0, 0, 0, 0.1);
            z-index: 1000;
        }

        .footer .nav-item {
            text-align: center;
            width: 33.33%;
            transition: transform 0.3s ease-out;
        }

        .footer .nav-item a {
            text-decoration: none;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .footer .nav-item img {
            width: 25px;
            height: 25px;
            margin-bottom: 5px;
        }

        .footer .nav-item p {
            font-size: 0.8rem;
            font-weight: 500;
            margin: 0;
            color: #333;
        }

        .footer .nav-item:hover {
            transform: scale(1.1);
        }

        /* Responsive Design */
        @media (min-width: 768px) {
            .header .title {
                font-size: 18px;
            }

            .content {
                margin-top: 70px;
                padding: 20px;
            }

            .product-container {
                grid-template-columns: repeat(2, 1fr);
            }

            .product-name {
                font-size: 24px;
            }

            .search-bar.active {
                width: 200px;
            }
        }

        @media (max-width: 767px) {
            .product-container {
                grid-template-columns: repeat(2, 1fr);
            }

            .footer .nav-item img {
                width: 20px;
                height: 20px;
            }

            .footer .nav-item p {
                font-size: 0.7rem;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <span class="back-arrow" onclick="history.back()">←</span>
        <h3 class="title">What are you looking for?</h3>
        <div class="search-container">
            <i class="fas fa-search search-icon"></i>
            <input type="text" class="search-bar" placeholder="Search products...">
            <div class="suggestions"></div>
        </div>
    </div>
    <div class="content">
        <div class="product-container">
            <div class="product-item">
                <img src="/main/chappal.jpg" alt="Crocs 1" class="product-image" onclick="window.location.href='/chappal/crocs.html'">
                <div class="product-name">CROCS</div>
            </div>
            <div class="product-item">
                <img src="/main/cherupp.jpg" alt="Crocs 2" class="product-image" onclick="window.location.href='/chappal/chappal.html'">
                <div class="product-name">CHAPPAL</div>
            </div>
            <div class="product-item">
                <img src="/dress/pant/pant13.jpeg" alt="PANT" class="product-image" onclick="window.location.href='/dress/pant.html'">
                <div class="product-name">PANT</div>
            </div>
            <div class="product-item">
                <img src="/dress/shirt/s13.jpeg" alt="SHIRT" class="product-image" onclick="window.location.href='/dress/shirt.html'">
                <div class="product-name">SHIRT</div>
            </div>
            <div class="product-item">
                <img src="/main/combo.jpg" alt="SHIRT COMBO" class="product-image" onclick="window.location.href='/dress/combo.html'">
                <div class="product-name">SHIRT COMBO</div>
            </div>
            <div class="product-item">
                <img src="/main/print t shirt.jpg" alt="T SHIRT" class="product-image" onclick="window.location.href='/dress/tshirt.html'">
                <div class="product-name">T SHIRT</div>
            </div>
            <div class="product-item">
                <img src="/main/print combo.jpg" alt="T SHIRT COMBO" class="product-image" onclick="window.location.href='/dress/combotshirt.html'">
                <div class="product-name">T SHIRT COMBO</div>
            </div>
            <div class="product-item">
                <img src="/watch/analog/w22.jpeg" alt="WATCH" class="product-image" onclick="window.location.href='/watch/analog.html'">
                <div class="product-name">WATCH</div>
            </div>
            <div class="product-item">
                <img src="/main/smart.jpg" alt="SMART WATCH" class="product-image" onclick="window.location.href='/watch/smart.html'">
                <div class="product-name">SMART WATCH</div>
            </div>
            <div class="product-item">
                <img src="/watch/smc/smc14.jpeg" alt="SMART WATCH COMBO" class="product-image" onclick="window.location.href='/watch/smc.html'">
                <div class="product-name">SMART COMBO</div>
            </div>
            <div class="product-item">
                <img src="/bag/travel/tr5.jpeg" alt="TRAVEL BAG" class="product-image" onclick="window.location.href='/bag/travel.html'">
                <div class="product-name">TRAVEL BAG</div>
            </div>
            <div class="product-item">
                <img src="/main/bag.jpg" alt="BACK BAG" class="product-image" onclick="window.location.href='/bag/school.html'">
                <div class="product-name">BACK BAG</div>
            </div>
            <div class="product-item">
                <img src="/main/shoe.jpeg" alt="SHOE" class="product-image" onclick="window.location.href='/shoe/shoe.html'">
                <div class="product-name">SHOE</div>
            </div>
            <div class="product-item">
                <img src="/headset/airpod/a50.jpeg" alt="AIRPOD" class="product-image" onclick="window.location.href='/headset/airpod.html'">
                <div class="product-name">AIRPOD</div>
            </div>
            <div class="product-item">
                <img src="/main/side.jpg" alt="SIDE BAG" class="product-image" onclick="window.location.href='/bag/side.html'">
                <div class="product-name">SIDE BAG</div>
            </div>
            <div class="product-item">
                <img src="/headset/headphone/h12.jpeg" alt="HEADPHONE" class="product-image" onclick="window.location.href='/headset/headphone.html'">
                <div class="product-name">HEADPHONE</div>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="footer">
        <div class="nav-item">
            <a href="/">
                <img src="https://img.icons8.com/ios-filled/50/333333/home.png" alt="Home">
                <p>Home</p>
            </a>
        </div>
        <div class="nav-item">
            <a href="/section">
                <img src="https://img.icons8.com/ios-filled/50/333333/category.png" alt="Categories">
                <p>Categories</p>
            </a>
        </div>
        <div class="nav-item">
            <a href="/about">
                <img src="https://img.icons8.com/ios-filled/50/333333/about.png" alt="About">
                <p>Help</p>
            </a>
        </div>
    </div>

    <script>
        const searchIcon = document.querySelector('.search-icon');
        const searchBar = document.querySelector('.search-bar');
        const suggestionsBox = document.querySelector('.suggestions');
        const productItems = document.querySelectorAll('.product-item');
        const productContainer = document.querySelector('.product-container');
        const products = Array.from(productItems).map(item => ({
            name: item.querySelector('.product-name').textContent.toLowerCase(),
            element: item,
            link: item.querySelector('.product-image').getAttribute('onclick')
        }));

        searchIcon.addEventListener('click', function(e) {
            e.stopPropagation();
            searchBar.classList.toggle('active');
            if (searchBar.classList.contains('active')) {
                searchBar.focus();
            } else {
                suggestionsBox.style.display = 'none';
                searchBar.value = ''; // Clear input when hiding
            }
        });

        searchBar.addEventListener('input', function() {
            const query = this.value.toLowerCase().trim();
            suggestionsBox.innerHTML = '';
            suggestionsBox.style.display = 'none';

            if (query) {
                const filteredProducts = products.filter(product => product.name.includes(query));
                if (filteredProducts.length > 0) {
                    filteredProducts.forEach(product => {
                        const suggestion = document.createElement('div');
                        suggestion.textContent = product.name.toUpperCase();
                        suggestion.addEventListener('click', () => {
                            // Hide all products
                            productItems.forEach(item => item.style.display = 'none');
                            // Show only the selected product
                            product.element.style.display = 'block';
                            // Move the selected product to the top
                            productContainer.prepend(product.element);
                            // Keep the onclick redirect functionality
                            product.element.querySelector('.product-image').setAttribute('onclick', product.link);
                            // Hide search bar and suggestions, clear input
                            searchBar.classList.remove('active');
                            suggestionsBox.style.display = 'none';
                            searchBar.value = '';
                        });
                        suggestionsBox.appendChild(suggestion);
                    });
                    suggestionsBox.style.display = 'block';
                }
            }
        });

        // Hide search bar and suggestions when clicking outside
        document.addEventListener('click', (e) => {
            if (!searchIcon.contains(e.target) && !searchBar.contains(e.target) && !suggestionsBox.contains(e.target)) {
                searchBar.classList.remove('active');
                suggestionsBox.style.display = 'none';
                searchBar.value = ''; // Clear input when hiding
            }
        });
    </script>
</body>
</html>
